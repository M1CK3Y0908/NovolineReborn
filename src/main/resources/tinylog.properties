# Minecraft-like console logger
writer1        = console
writer1.level  = info
writer1.format = [{date:HH:mm:ss}] [{thread}/{level}]: {tag}{message}
# Minecraft-like file logger
writer2             = rolling file
writer2.level       = info
writer2.format      = [{date:HH:mm:ss}] [{thread}/{level}]: {message}
writer2.file        = logs/{date: yyyy-MM-dd}-{count}.log
writer2.latest      = logs/latest.log
writer2.buffered    = true
writer2.policies    = startup, daily: 00:00
writer2.convert     = gzip
writingthread = true
